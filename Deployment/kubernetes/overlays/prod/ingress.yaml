apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loyalty-ingress
  namespace: loyalty-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/limit-rps: "10"
spec:
  tls:
  - hosts:
    - loyaltyprogramberijalan.34.50.82.124.nip.io
    secretName: loyalty-tls-secret
  rules:
  - host: loyaltyprogramberijalan.34.50.82.124.nip.io
    http:
      paths:
      - path: /api/employee
        pathType: Prefix
        backend:
          service:
            name: loyalty-backend
            port:
              number: 80
      - path: /api/admin
        pathType: Prefix
        backend:
          service:
            name: loyalty-backend
            port:
              number: 80
      - path: /api/leader
        pathType: Prefix
        backend:
          service:
            name: loyalty-backend
            port:
              number: 80
      - path: /api/auth/login
        pathType: Prefix
        backend:
          service:
            name: loyalty-backend
            port:
              number: 80
      - path: /api/auth/verify
        pathType: Prefix
        backend:
          service:
            name: loyalty-backend
            port:
              number: 80
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: loyalty-backend
            port:
              number: 80
      - path: /api-docs
        pathType: Prefix
        backend:
          service:
            name: loyalty-backend
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: loyalty-frontend
            port:
              number: 80
