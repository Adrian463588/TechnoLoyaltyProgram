apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: loyalty-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loyalty-postgres
  namespace: loyalty-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loyalty-postgres
  template:
    metadata:
      labels:
        app: loyalty-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: loyalty_user
        - name: POSTGRES_PASSWORD
          value: loyalty_pass
        - name: POSTGRES_DB
          value: loyalty_db
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty-postgres
  namespace: loyalty-prod
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: loyalty-postgres
