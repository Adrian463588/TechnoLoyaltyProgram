apiVersion: apps/v1
kind: Deployment
metadata:
  name: loyalty-redis
  namespace: loyalty-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loyalty-redis
  template:
    metadata:
      labels:
        app: loyalty-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty-redis
  namespace: loyalty-prod
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: loyalty-redis
