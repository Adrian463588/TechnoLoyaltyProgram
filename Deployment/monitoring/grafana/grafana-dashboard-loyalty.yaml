apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  loyalty-program.json: |
    {
      "id": null,
      "uid": "loyalty-program-v1",
      "title": "Loyalty Program — Overview",
      "description": "Token balance, redemption, API performance, and pod health for Loyalty Program",
      "tags": ["loyalty", "production"],
      "timezone": "Asia/Jakarta",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "constant",
            "current": { "value": "loyalty-prod" },
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Total Pods Running",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 1 },
                  { "color": "green", "value": 2 }
                ]
              },
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{namespace=\"loyalty-prod\", phase=\"Running\"})",
              "legendFormat": "Running Pods",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "API Request Rate (RPS)",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": 0 },
                  { "color": "green", "value": 1 }
                ]
              },
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"loyalty-prod\"}[5m]))",
              "legendFormat": "RPS",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Error Rate (%)",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "percent",
              "decimals": 2
            }
          },
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_total{namespace=\"loyalty-prod\", status=~\"5..\"}[5m])) / sum(rate(http_requests_total{namespace=\"loyalty-prod\"}[5m]))",
              "legendFormat": "Error %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Prometheus Targets Up",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "options": {
            "colorMode": "background",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "green", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "count(up == 1)",
              "legendFormat": "Targets Up",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "API Latency — P50 / P95 / P99",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": { "unit": "s", "color": { "mode": "palette-classic" } }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace=\"loyalty-prod\"}[5m])) by (le))",
              "legendFormat": "P50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"loyalty-prod\"}[5m])) by (le))",
              "legendFormat": "P95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"loyalty-prod\"}[5m])) by (le))",
              "legendFormat": "P99",
              "refId": "C"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Container CPU Usage",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "palette-classic" } }
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"loyalty-prod\", container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Container Memory Usage",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" } }
          },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"loyalty-prod\", container!=\"\"})",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "HTTP Request Rate by Status Code",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "options": {
            "tooltip": { "mode": "multi" },
            "legend": { "displayMode": "list", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "color": { "mode": "palette-classic" } }
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total{namespace=\"loyalty-prod\"}[5m]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "type": "table",
          "title": "Pod Status — loyalty-prod",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "options": {
            "showHeader": true,
            "footer": { "show": false }
          },
          "targets": [
            {
              "expr": "kube_pod_status_phase{namespace=\"loyalty-prod\"}",
              "legendFormat": "{{pod}} — {{phase}}",
              "refId": "A",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "labelsToFields", "options": {} },
            {
              "id": "organize",
              "options": {
                "renameByName": { "pod": "Pod", "phase": "Phase", "Value": "State" }
              }
            }
          ]
        }
      ]
    }
