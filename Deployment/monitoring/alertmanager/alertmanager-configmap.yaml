apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      receiver: 'blackhole'
    receivers:
    - name: 'blackhole'
    # TODO(OQ-ALERTMANAGER-RECEIVER): mount a Secret-backed receiver config
    # for Discord/Slack/PagerDuty after the production webhook is rotated.
  discord.tmpl: |
    {{ define "discord.title" }}
      [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.SortedPairs.Values | join " " }}
    {{ end }}
    {{ define "discord.message" }}
      {{ range .Alerts }}
        **Alert:** {{ .Annotations.summary }}
        **Description:** {{ .Annotations.description }}
        **Details:**
        {{ range .Labels.SortedPairs }} - {{ .Name }}: {{ .Value }}
        {{ end }}
      {{ end }}
    {{ end }}
