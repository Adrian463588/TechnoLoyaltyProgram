apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alerting-rules.yaml: |
    groups:
    - name: loyalty-devops-alerts
      rules:
      - alert: HighCPUUsage
        expr: sum(rate(container_cpu_usage_seconds_total{namespace=~"devops|monitoring|argocd", container!=""}[5m])) by (namespace, pod) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on pod {{ $labels.namespace }}/{{ $labels.pod }}"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is using more than 80% CPU for the last 5 minutes."
      
      - alert: HighMemoryUsage
        expr: sum(container_memory_usage_bytes{namespace=~"devops|monitoring|argocd", container!=""}) by (namespace, pod) > 500000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Memory usage on pod {{ $labels.namespace }}/{{ $labels.pod }}"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is using more than 500MB of memory."

      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target down"
          description: "The Prometheus self-scrape target is unreachable."
