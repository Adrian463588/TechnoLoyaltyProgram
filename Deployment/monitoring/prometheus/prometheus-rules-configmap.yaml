apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alerting-rules.yaml: |
    groups:
    - name: loyalty-alerts
      rules:
      - alert: HighCPUUsage
        expr: sum(rate(container_cpu_usage_seconds_total{namespace="loyalty-prod"}[5m])) by (pod) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on pod {{ $labels.pod }}"
          description: "Pod {{ $labels.pod }} is using more than 80% CPU for the last 5 minutes."
      
      - alert: HighMemoryUsage
        expr: sum(container_memory_usage_bytes{namespace="loyalty-prod"}) by (pod) > 500000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Memory usage on pod {{ $labels.pod }}"
          description: "Pod {{ $labels.pod }} is using more than 500MB of memory."

      - alert: InstanceDown
        expr: up{job="loyalty-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend Instance Down"
          description: "The loyalty-backend instance is unreachable."
