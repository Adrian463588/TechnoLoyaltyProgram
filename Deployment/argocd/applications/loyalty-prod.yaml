apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loyalty-program-prod
  namespace: argocd
  # DevSecOps: Protect from accidental deletion
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: loyalty-program
  source:
    repoURL: https://github.com/Adrian463588/TechnoLoyaltyProgram
    targetRevision: main
    path: Deployment/kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: loyalty-prod
  syncPolicy:
    automated:
      prune: true       # Auto-delete resources removed from Git
      selfHeal: true    # Auto-revert manual changes in cluster
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
