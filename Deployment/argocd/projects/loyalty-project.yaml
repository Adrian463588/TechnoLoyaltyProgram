apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: loyalty-program
  namespace: argocd
spec:
  description: Loyalty Program DevOps Project
  sourceRepos:
  - 'https://github.com/Adrian463588/TechnoLoyaltyProgram'
  destinations:
  - namespace: argocd
    server: https://kubernetes.default.svc
  - namespace: devops
    server: https://kubernetes.default.svc
  - namespace: monitoring
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: autoscaling
    kind: HorizontalPodAutoscaler
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  namespaceResourceBlacklist:
  - group: ''
    kind: ResourceQuota
  - group: ''
    kind: LimitRange
  roles:
  - name: developer
    description: Read-only access for developers
    policies:
    - p, proj:loyalty-program:developer, applications, get, loyalty-program/*, allow
    groups:
    - developers-group
