apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins-ingress
  namespace: tools
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: jenkins.34.101.180.46.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  number: 80
