# Gitleaks configuration for DevSecOps secret scanning
title = "Loyalty Program Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for build artifacts and lockfiles"
paths = [
  '''(?i)package-lock\.json$''',
  '''(?i)pnpm-lock\.yaml$''',
  '''(?i).*\.sbom\.json$''',
  '''(?i).*test-results.*''',
]
regexes = [
  '''your-super-secret-32-char-string-here''',
  '''your-gemini-api-key-here''',
]
