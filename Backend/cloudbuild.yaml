steps:
  # ── Build Docker image ──────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "--tag=gcr.io/$PROJECT_ID/loyalty-backend:$COMMIT_SHA"
      - "--tag=gcr.io/$PROJECT_ID/loyalty-backend:latest"
      - "--file=Dockerfile"
      - "."

  # ── Push to Container Registry ──────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "--all-tags"
      - "gcr.io/$PROJECT_ID/loyalty-backend"

  # ── Deploy to Cloud Run ─────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - loyalty-backend
      - "--image=gcr.io/$PROJECT_ID/loyalty-backend:$COMMIT_SHA"
      - "--platform=managed"
      - "--region=asia-southeast2"
      - "--allow-unauthenticated"
      - "--port=3000"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--set-env-vars=NODE_ENV=production,FRONTEND_ORIGIN=https://loyalty-frontend-$$REGION-$$PROJECT_ID.a.run.app"
      - "--set-secrets=DATABASE_URL=loyalty-db-url:latest,NEXTAUTH_SECRET=nextauth-secret:latest"

images:
  - "gcr.io/$PROJECT_ID/loyalty-backend:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/loyalty-backend:latest"

options:
  logging: CLOUD_LOGGING_ONLY
